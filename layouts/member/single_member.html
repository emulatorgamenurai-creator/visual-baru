{{ define "main" }}
<div class="dashboard-container" style="max-width: 600px; margin: 40px auto; padding: 25px; border: 2px solid #2ecc71; border-radius: 12px; font-family: 'Courier New', Courier, monospace; background-color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">

    <h2 style="color: #2c3e50; border-bottom: 2px dashed #2ecc71; padding-bottom: 10px; margin-top: 0;">
        💻 DASHBOARD UTAMA
    </h2>

    <p style="font-size: 16px;">Nama Anggota: <strong style="color: #34495e;">{{ .Params.nama_lengkap }}</strong></p>
    <p style="font-size: 14px; color: #7f8c8d;">Sistem ID: <span>@{{ .Params.username }}</span></p>

    <div class="score-box" style="background: #f4f6f7; padding: 15px; border-left: 5px solid #2ecc71; margin: 20px 0; border-radius: 4px;">
        <span style="font-size: 12px; color: #95a5a6; display: block; text-transform: uppercase; font-weight: bold;">
            Hasil Kalkulator Digital:
        </span>
        <span style="font-size: 32px; color: #e74c3c; font-weight: bold;">
            {{ .Params.total_skor }}
        </span>
    </div>

    <div class="ai-box" style="background: #e8f8f5; padding: 15px; border: 1px solid #a3e4d7; border-radius: 8px;">
        <span style="font-size: 13px; color: #16a085; font-weight: bold; display: block; margin-bottom: 5px;">
            🧠 WEJANGAN QWEN OFFLINE (KALIMANTAN CORE):
        </span>
        <p style="margin: 0; font-style: italic; color: #117a65; line-height: 1.5;">
            "{{ .Content }}"
        </p>
    </div>

    <p style="font-size: 11px; color: #bdc3c7; margin-top: 25px; text-align: center;">
        Dicetak otomatis tanpa jaringan database luar.
    </p>
</div>
{{ end }}
